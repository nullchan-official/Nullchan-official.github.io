<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>0chan - Anonymous Feed</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f4f4f5;
            --border: #e4e4e7;
            --text: #18181b;
            --text-muted: #71717a;
            --accent: #a78bfa;
            --vip-gold: #D4AF37;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Test Controls - Just so you can see both perspectives */
        .test-panel {
            background: var(--surface);
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 70vh;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85em;
        }

        .author {
            font-weight: bold;
            color: var(--accent);
        }

        .vip-author {
            color: var(--vip-gold);
            font-weight: 800;
        }

        .time {
            color: var(--text-muted);
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--border);
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        button:hover { background: #9061f9; }
    </style>
</head>
<body>

    <!-- Perspective Switcher (For testing) -->
    <div class="test-panel">
        <div>
            <strong>Viewing as: </strong>
            <select id="userSwitcher" onchange="switchUser()">
                <option value="usr_1nw63xp">usr_1nw63xp (You)</option>
                <option value="usr_999999">usr_999999 (Random Person)</option>
            </select>
        </div>
        <div style="font-size: 0.8em; color: var(--text-muted);">
            Type "badword" to test filter | Spam fast to test antispam
        </div>
    </div>

    <!-- Chat App -->
    <div class="chat-container">
        <div class="messages" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Type a message or yourtoken()..." onkeypress="handleEnter(event)">
            <button onclick="handleSend()">Send</button>
        </div>
    </div>

    <script>
        const TARGET_ID = 'usr_1nw63xp';
        let currentUserId = TARGET_ID;
        let lastMessageTime = 0;
        let globalMessages = []; // Store messages to re-render when switching perspective

        // ==========================================
        // 1. FILTER & ANTI-SPAM LOGIC
        // ==========================================
        function isSpamming(userId) {
            // BYPASS FOR YOU
            if (userId === TARGET_ID) return false; 
            
            const now = Date.now();
            if (now - lastMessageTime < 2500) { // 2.5 second cooldown for normal users
                return true; 
            }
            lastMessageTime = now;
            return false;
        }

        function applyFilter(text, userId) {
            // BYPASS FOR YOU
            if (userId === TARGET_ID) return text; 
            
            // Basic mock filter for normal users
            return text.replace(/badword/gi, '****');
        }

        // ==========================================
        // 2. SENDING & COMMAND LOGIC
        // ==========================================
        function handleSend() {
            const input = document.getElementById('chatInput');
            let text = input.value.trim();
            if (!text) return;

            // Run Antispam
            if (isSpamming(currentUserId)) {
                alert("Anti-Spam: Please wait a moment before sending another message.");
                return;
            }

            // Run Filter
            text = applyFilter(text, currentUserId);

            // Command Check
            const isTokenCommand = (text === 'yourtoken()');

            const msg = {
                id: Date.now(),
                senderId: currentUserId,
                // If it's the token command, the text just becomes their token (ID)
                text: isTokenCommand ? currentUserId : text, 
                isCommand: isTokenCommand,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            globalMessages.push(msg);
            renderAllMessages(); // Re-render chat
            input.value = '';
            
            // Scroll to bottom
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') handleSend();
        }

        // ==========================================
        // 3. RENDERING & PERSPECTIVE LOGIC
        // ==========================================
        function renderAllMessages() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = ''; // Clear current view

            globalMessages.forEach(msg => {
                const isSentByTarget = (msg.senderId === TARGET_ID);
                const amITheTarget = (currentUserId === TARGET_ID);

                // Default author is the raw ID
                let displayAuthor = msg.senderId;

                // OVERRIDE LOGIC: 
                // If target sent it, AND I am not the target, AND it's not the token command
                if (isSentByTarget && !amITheTarget && !msg.isCommand) {
                    displayAuthor = 'FILENFOLDER';
                }

                // STYLE LOGIC:
                // VIPs get golden yellow text regardless of perspective
                const textStyle = isSentByTarget ? 'color: var(--vip-gold); font-weight: 600;' : '';
                // Add golden name styling if the override is active
                const authorClass = (displayAuthor === 'FILENFOLDER') ? 'vip-author' : 'author';

                const div = document.createElement('div');
                div.className = 'message';
                div.innerHTML = `
                    <div class="msg-header">
                        <span class="${authorClass}">${escapeHtml(displayAuthor)}</span>
                        <span class="time">${msg.timestamp}</span>
                    </div>
                    <div class="msg-body" style="${textStyle}">
                        ${escapeHtml(msg.text)}
                    </div>
                `;
                chatBox.appendChild(div);
            });
        }

        // Helper to prevent HTML injection
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // Test Helper to swap users
        function switchUser() {
            currentUserId = document.getElementById('userSwitcher').value;
            renderAllMessages(); // Re-render to see how the new user views the history
        }

    </script>
</body>
</html>
